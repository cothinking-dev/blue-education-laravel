; Laravel queue worker for blue-education-laravel.
;
; Install path: /etc/supervisor/conf.d/blue-education-worker.conf
;
; After copying, reload supervisor:
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start blue-education-worker:*
;
; To check status:
;   sudo supervisorctl status

[program:blue-education-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/deployer/blue-education-laravel/current/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --backoff=10
autostart=true
autorestart=true
user=deployer
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/blue-education-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
